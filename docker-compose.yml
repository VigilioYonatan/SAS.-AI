    db:
        image: postgres:alpine3.19
        restart: always
        ports:
            - ${DB_PORT}:5432
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASS}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - postgres-data-saas:/var/lib/postgresql/data
volumes:
    postgres-data-saas:
