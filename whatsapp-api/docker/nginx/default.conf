server {
    listen 80;
    server_name paul-estes.docker.vigilio-services.com www.paul-estes.docker.vigilio-services.com;

    client_max_body_size 100M; # Permite subir archivos más de 100 MB

    location / {
        proxy_pass http://node-app:5001; # Proxy a la app Node en el contenedor
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirige www a la versión sin www
    if ($host = www.paul-estes.docker.vigilio-services.com) {
        return 301 $scheme://paul-estes.docker.vigilio-services.com$request_uri;
    }
}